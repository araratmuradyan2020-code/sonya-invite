<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение — день рождения Сони</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(-45deg, #fbeaf0, #f4c0d1, #f0997b, #ed93b1);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    overflow: hidden;
    position: relative;
    padding: 24px;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* glow orbs drifting in background */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.5;
    pointer-events: none;
    animation: drift ease-in-out infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    33%  { transform: translate(30px, -40px) scale(1.15); }
    66%  { transform: translate(-25px, 25px) scale(0.9); }
    100% { transform: translate(0, 0) scale(1); }
  }

  /* floating petals / confetti */
  .petal {
    position: absolute;
    border-radius: 60% 0 60% 0;
    animation: fall linear infinite;
    opacity: 0.85;
    pointer-events: none;
    top: -5vh;
  }
  @keyframes fall {
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.95; }
    50%  { transform: translateY(50vh) translateX(20px) rotate(180deg); }
    100% { transform: translateY(115vh) translateX(-10px) rotate(360deg); opacity: 0; }
  }

  /* sparkles */
  .spark {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px 2px rgba(255,255,255,0.9);
    animation: twinkle ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50%      { opacity: 1; transform: scale(1.3); }
  }

  .card-wrap {
    position: relative;
    z-index: 3;
    perspective: 1200px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: #fffdfb;
    border-radius: 24px;
    box-shadow: 0 40px 80px rgba(75, 21, 40, 0.35), 0 0 0 1px rgba(212,83,126,0.25) inset;
    padding: 48px 32px 40px;
    text-align: center;
    opacity: 0;
    transform: rotateX(-12deg) translateY(60px) scale(0.9);
    animation: cardIn 1.3s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: rotateX(0deg) translateY(0) scale(1); }
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 16px;
    border: 1px dashed rgba(212,83,126,0.4);
    opacity: 0;
    animation: fadeIn 0.8s ease forwards 0.9s;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .stork {
    width: 76px;
    height: 76px;
    margin: 0 auto 8px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.5s, wobble 3.5s ease-in-out infinite 2.4s;
  }
  @keyframes wobble {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    25%      { transform: rotate(-2deg) translateY(-3px); }
    75%      { transform: rotate(2deg) translateY(2px); }
  }
  .stork svg { width: 100%; height: 100%; overflow: visible; }
  .stork path, .stork line {
    fill: none;
    stroke: #993556;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 260;
    stroke-dashoffset: 260;
    animation: draw 2.4s ease forwards 0.7s;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 36px;
    color: #4b1528;
    opacity: 0;
    letter-spacing: 0.01em;
    animation: fadeUp 0.9s ease forwards 1.2s;
    background: linear-gradient(90deg, #4b1528, #993556, #d4537e, #4b1528);
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fadeUp 0.9s ease forwards 1.2s, shimmer 6s linear infinite 2.1s;
  }
  @keyframes shimmer {
    to { background-position: -300% center; }
  }

  .subtitle {
    margin-top: 8px;
    font-size: 15px;
    letter-spacing: 0.03em;
    color: #993556;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 1.5s;
  }

  .divider {
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4537e, transparent);
    margin: 24px auto;
    animation: growLine 0.9s ease forwards 1.8s;
  }
  @keyframes growLine { to { width: 180px; } }

  .details { opacity: 0; animation: fadeUp 0.9s ease forwards 2.1s; }

  .datetime {
    font-size: 19px;
    font-weight: 500;
    color: #4b1528;
    margin-bottom: 22px;
    position: relative;
    display: inline-block;
  }

  .venue {
    font-family: 'Playfair Display', serif;
    font-size: 23px;
    color: #4b1528;
    margin-bottom: 4px;
  }

  .address { font-size: 14px; color: #993556; margin-bottom: 20px; }

  .note {
    font-size: 13.5px;
    color: #993556;
    line-height: 1.7;
    margin-bottom: 22px;
  }

  .rsvp {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    color: #4b1528;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 2.4s;
  }

  .heart {
    display: inline-block;
    color: #d4537e;
    animation: pulse 1.2s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.35); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 420px) {
    .card { padding: 36px 22px 32px; }
    h1 { font-size: 30px; }
    .venue { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="card-wrap">
  <div class="card">
    <div class="stork">
      <svg viewBox="0 0 100 100">
        <path d="M50 8 C 63 13, 69 29, 61 44 C 57 51, 49 56, 49 67"/>
        <path d="M20 82 a 26,17 0 1,0 52,0 a 26,17 0 1,0 -52,0"/>
        <path d="M68 76 L 89 65"/>
        <line x1="46" y1="99" x2="46" y2="127" transform="translate(0,-41)"/>
        <line x1="38" y1="88" x2="54" y2="88"/>
      </svg>
    </div>

    <h1>Приглашение</h1>
    <div class="subtitle">на день рождения Сони — 20&nbsp;лет</div>

    <div class="divider"></div>

    <div class="details">
      <div class="datetime">19 сентября, суббота · 17:00</div>
      <div class="venue">Ресторан AIST</div>
      <div class="address">Малая Бронная, 8/1</div>
      <div class="note">будет тепло, красиво и по-настоящему<br>приходи нарядной — праздник ждёт тебя</div>
    </div>

    <div class="rsvp">подтверди, пожалуйста, что придёшь <span class="heart">♡</span></div>
  </div>
</div>

<script>
  const petalColors = ['#f5c4b3', '#f0997b', '#f4c0d1', '#ed93b1', '#fac775'];
  const body = document.body;

  for (let i = 0; i < 34; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 6 + Math.random() * 12;
    p.style.left = Math.random() * 100 + 'vw';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = petalColors[Math.floor(Math.random() * petalColors.length)];
    p.style.animationDuration = (7 + Math.random() * 9) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    body.appendChild(p);
  }

  for (let i = 0; i < 5; i++) {
    const o = document.createElement('div');
    o.className = 'orb';
    const size = 120 + Math.random() * 180;
    o.style.width = size + 'px';
    o.style.height = size + 'px';
    o.style.left = Math.random() * 90 + 'vw';
    o.style.top = Math.random() * 90 + 'vh';
    o.style.background = petalColors[Math.floor(Math.random() * petalColors.length)];
    o.style.animationDuration = (8 + Math.random() * 8) + 's';
    o.style.animationDelay = (Math.random() * 4) + 's';
    body.appendChild(o);
  }

  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    s.style.animationDelay = (Math.random() * 3) + 's';
    body.appendChild(s);
  }
</script>

</body>
</html>
